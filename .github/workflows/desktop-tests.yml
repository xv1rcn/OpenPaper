name: Desktop build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install backend packaging dependencies
        run: python -m pip install -r scripts/packaging/requirements.txt
      - name: Freeze Python backend
        run: python scripts/packaging/build_backend.py
      - name: Test relocated backend without source or venv
        run: python scripts/packaging/smoke_backend.py desktop/packaged/openpaper-backend
      - name: Build release application and installer
        run: npx --yes --package=@tauri-apps/cli@2.11.4 tauri build --config tauri.bundle.conf.json --bundles ${{ matrix.bundle }} -- --locked
        working-directory: desktop
      - name: Verify backend from the application package
        run: python scripts/packaging/verify_bundle.py ${{ matrix.bundle }}
      - name: Collect distributable packages and checksums
        run: python scripts/packaging/collect_artifacts.py ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPaper-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14
